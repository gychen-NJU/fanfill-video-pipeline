<p class="lede">An agent-driven, file-based pipeline. No database: the config, the shot list, the progress

<h2>The one idea worth stealing</h2>
<div class="flow"><b>Files are the source of truth. No database.</b>

   agent (skill + scripts) ────┤ project config │──── web panel (read-only)
                                     │
              progress doc   (human-readable progress + artefact index)
              cost ledger    (one row per charge)
              shot list      (the cuts — shared by scripts and UI)</div>
<p>Changing songs means changing a workspace directory, not migrating a database.</p>

<h2>How it works</h2>
<p>Two delivery lines that meet in the middle:</p>
<div class="flow">MUSIC   source ─► stems ─► align ─► vocal render ─► (voice conversion) ─► mix ─► master
VIDEO   lyrics ─► shots ─► refs ─► prompts ─► generation ─► subs ─► assemble ─► upscale ─► verify</div>
<p><strong>The coupling point:</strong> cuts must land on the <em>measured</em> vocal onsets, not the lyric
file's nominal timestamps. Lyric files are hand-made timing art, not measurements — they drift, sometimes by
most of a second, and a cut placed on a wrong timestamp slices through a word. So the scripts read the vocal
stem's RMS envelope, find the true onsets and the real silences, and snap each cut into a silence valley.</p>

<h3>Stages</h3>
<div class="scroll"><table>
<thead><tr><th>#</th><th>Stage</th><th>Command</th><th>Paid?</th></tr></thead>
<tbody>
<tr><td>1</td><td>Survey + config</td><td>—</td><td>no</td></tr>

<tr><td>4</td><td>Reference images</td><td><code>node scripts/81_pv_refs.mjs</code></td><td>no</td></tr>
<tr><td>5</td><td><strong>Video generation</strong></td><td><code>node scripts/82_pv_clips.mjs --only 1,2,3</code></td><td><strong>yes</strong></td></tr>
<tr><td>6</td><td>Subtitles</td><td><code>node scripts/83_pv_subs.mjs --w 1920 --h 1080 --tag 1080</code></td><td>no</td></tr>
<tr><td>7</td><td>Assemble</td><td><code>node scripts/84_pv_assemble.mjs</code></td><td>no</td></tr>

</tbody></table></div>
<p>Stage 2 is deliberately out of scope — separation, transcription, vocal synthesis and mixing are their own
problem with their own tools. This repository owns the <strong>video line</strong> plus the decisions that bind
it to music: timing, cost, verification, non-destructiveness.</p>

<h2>Install</h2>
<p>No package dependencies: every script is a standalone <code>.mjs</code> file.</p>
<div class="scroll"><table>
<thead><tr><th>Dependency</th><th>Needed for</th><th>Required?</th></tr></thead>
<tbody>
<tr><td>Node.js ≥ 18</td><td>every script</td><td><strong>yes</strong></td></tr>
<tr><td>FFmpeg + ffprobe</td><td>alignment, refs, subtitles, assemble, verify</td><td><strong>yes</strong></td></tr>
<tr><td>A video-generation API key</td><td>shot generation — the only paid stage</td><td>stage 5 only</td></tr>
<tr><td>Real-ESRGAN ncnn-vulkan</td><td>free local upscale</td><td>optional</td></tr>
<tr><td>ImageMagick</td><td>two cover layouts</td><td>optional</td></tr>
<tr><td>DeepSeek Harness</td><td>skill / preset / panel integration</td><td>optional</td></tr>

<pre><code>git clone https://github.com/gychen-NJU/fanfill-video-pipeline my-song
cd my-song
node tools/smoke-test.mjs   # 13 self-checks on a synthetic workspace — writes nothing outside a temp dir</code></pre>

<div class="note warnnote">

</div>

<h3>Let an agent do it</h3>
<p>Paste this into a fresh session in the cloned directory:</p>
<pre><code>Read docs/BOOTSTRAP.md and install this project for me, following it step by step.
Verify each step with the command it gives, stop and ask me only for things you
cannot do yourself (the API key, and restarting dsh web if needed).
When you finish, run \`node tools/smoke-test.mjs\` and report the result.</code></pre>
<p><code>docs/BOOTSTRAP.md</code> gives an exact command, an expected result and a fallback for every step,
plus the rules the agent must follow: verify each step, never invent success, and ask only for what it cannot
do itself.</p>

<h2>Hard constraints</h2>
<p>Not style preferences — each one cost real time or real money.</p>
<div class="scroll"><table>
<thead><tr><th>Constraint</th><th>Why</th></tr></thead>
<tbody>
<tr><td>Prompt capped at 7000 characters</td><td>API hard limit.</td></tr>
<tr><td>Reference images and a first-frame image are mutually exclusive</td><td>Want reference <em>and</em> continuity? Ref2VA for the opening shot, then chain each later shot from the previous clip's last frame.</td></tr>
<tr><td>Reference routing needs the model's Ref2VA mode</td><td>The image model's <code>subject_reference</code> accepts only public URLs; local files cannot be referenced.</td></tr>
<tr><td>Never extract frames from the finished film</td><td>It already has burned-in subtitles. Extract from the per-shot clips.</td></tr>
<tr><td>Re-burn subtitles at the target resolution</td><td>Scaling a subtitled video scales the text too.</td></tr>
<tr><td>Real upscaling ≠ resampling</td><td>Lanczos makes a bigger file, not a sharper picture. Use Real-ESRGAN.</td></tr>
<tr><td>Measure onsets; do not trust the lyric file</td><td>Nominal timestamps drift; a cut on a wrong timestamp slices a word.</td></tr>
<tr><td>Absolute paths for ffmpeg</td><td>A bundled ImageMagick <code>ffmpeg</code> shadows the real one.</td></tr>
<tr><td>Write <code>.mjs</code> files; never <code>node -e</code></td><td>PowerShell 5.1 eats inline scripts.</td></tr>
<tr><td>Read/write non-ASCII files with Node</td><td>A <code>Get-Content</code> → <code>ConvertFrom-Json</code> round-trip silently corrupts UTF-8.</td></tr>
<tr><td>One shot ≤ <code>segMaxSec</code> (default 15 s)</td><td>Model limit; longer clips drift more.</td></tr>
<tr><td>Subtitles hold ≥ 3 s by default</td><td>Below that the line is unreadable.</td></tr>
</tbody></table></div>

<h2>Discipline it assumes</h2>
<ul>
  <li><strong>Non-destructive by default.</strong> Inputs are read-only; replaced outputs move to <code>history/&lt;timestamp&gt;/</code>; new outputs get <code>vN</code> names. Never overwrite.</li>
  <li><strong>One authorization, then a ledger.</strong> Ask once for a budget, record every charge, stop only when the estimate would exceed it.</li>
  <li><strong>Quality-type acceptance needs a 1:1 comparison.</strong> "Sharper" is not delivered by a passing spec sheet — produce same-frame A/B evidence.</li>
  <li><strong>Absolute paths, then stop for review.</strong></li>
  <li><strong>Local-first.</strong> Upscaling, separation and mixing run on your own machine for free.</li>
  <li><strong>Attribution is a blocker.</strong> AI-generated notice, non-commercial notice, full credit to the original.</li>
</ul>

</div>

<div class="flow">音乐线  原曲 ─► 分离 ─► 对齐 ─► 出人声 ─►（换音色）─► 混音 ─► 母带
视频线  歌词 ─► 分镜 ─► 参考图 ─► 提示词 ─► 生成 ─► 字幕 ─► 合成 ─► 超分 ─► 核验</div>

找出真实起音与真实静音，再把每个切点<strong>吸附进静音谷</strong>。</p>

<strong>视频线</strong>，以及把它和音乐绑在一起的那些决策：时间、成本、验收、非破坏性。</p>

<h2>硬约束</h2>
<p>不是风格偏好——每一条都花过真实时间或真实金钱。</p>
<div class="scroll"><table>
<thead><tr><th>约束</th><th>为什么</th></tr></thead>
<tbody>
<tr><td>单条提示词上限 7000 字符</td><td>API 硬顶。</td></tr>
<tr><td>参考图与首帧图互斥</td><td>既要参考又要连续？首镜用 Ref2VA，后续每段拿上一段末帧续拍。</td></tr>
<tr><td>参考图必须走模型的 Ref2VA 模式</td><td>图像模型的 <code>subject_reference</code> 只收公网 URL，本地文件引用不了。</td></tr>
<tr><td>绝不从成片取帧</td><td>成片已烧进字幕。要从每段原始片段取。</td></tr>
<tr><td>字幕在目标分辨率重烧</td><td>缩放带字幕的视频，字会被一起缩放。</td></tr>
<tr><td>真超分 ≠ 重采样</td><td>lanczos 只是把文件变大，不是把画面变清楚。用 Real-ESRGAN。</td></tr>
<tr><td>测起音，别信歌词文件</td><td>名义时间戳会漂；按错的时间下刀会切断词。</td></tr>
<tr><td>ffmpeg 用绝对路径</td><td>PATH 上 ImageMagick 自带的会挡掉真的那个。</td></tr>
<tr><td>写 <code>.mjs</code>，不要 <code>node -e</code></td><td>PowerShell 5.1 会吃掉内联脚本。</td></tr>
<tr><td>含非 ASCII 的文件用 Node 读写</td><td><code>Get-Content</code> → <code>ConvertFrom-Json</code> 往返会静默写坏 UTF-8。</td></tr>
<tr><td>单段 ≤ <code>segMaxSec</code>（默认 15s）</td><td>模型限制；段越长漂得越厉害。</td></tr>
<tr><td>字幕默认至少显示 3s</td><td>低于这个值读不清。</td></tr>
</tbody></table></div>

<h2>默认纪律</h2>
<ul>
  <li><strong>默认非破坏性。</strong>输入只读；被替换的产物移入 <code>history/&lt;时间戳&gt;/</code>；新产物用 <code>vN</code> 命名。绝不覆盖。</li>
  <li><strong>一次总授权 + 逐笔台账。</strong>预算问一次，每笔记账，只在预估会突破时停。</li>
  <li><strong>质量型需求必须 1:1 对比。</strong>"更清晰"不是靠参数全绿交付的——要出同帧 A/B 证据。</li>
  <li><strong>给绝对路径，然后停下等检查。</strong></li>
  <li><strong>本地免费优先。</strong>超分、分离、混音都跑在自己机器上。</li>
  <li><strong>署名是交付阻塞项。</strong>AI 生成标识 + 非商用声明 + 完整原作出处。</li>
</ul>

const KEY = 'fanfill-lang';
const THEME_KEY = 'fanfill-theme';

function setLang(lang, { persist = true } = {}) {
  const l = I18N[lang] ? lang : 'en';
  document.documentElement.lang = l === 'zh' ? 'zh-CN' : 'en';
  document.documentElement.dataset.lang = l;
  document.getElementById('content').innerHTML = I18N[l].html;
  document.getElementById('t-tagline').textContent = I18N[l].tagline;
  document.getElementById('t-footer').textContent = I18N[l].footer;
  document.getElementById('t-hint').textContent = I18N[l].hint;
  document.getElementById('lang-en').setAttribute('aria-pressed', String(l === 'en'));
  document.getElementById('lang-zh').setAttribute('aria-pressed', String(l === 'zh'));
  document.title = l === 'zh'
    ? 'fanfill-video-pipeline（翻填视频流水线）'
    : 'fanfill-video-pipeline';
  if (persist) { try { localStorage.setItem(KEY, l); } catch {} }

  // Keep ?lang= shareable without a reload.
  const url = new URL(location.href);
  if (url.searchParams.get('lang') !== l) {
    url.searchParams.set('lang', l);
    history.replaceState(null, '', url);
  }
}

function toggleTheme() {
  const cur = document.documentElement.dataset.theme || 'dark';
  const next = cur === 'dark' ? 'light' : 'dark';
  applyTheme(next, true);
}

function applyTheme(theme, persist) {
  document.documentElement.dataset.theme = theme;
  document.getElementById('theme-btn').textContent = theme === 'dark' ? '◐' : '◑';
  if (persist) { try { localStorage.setItem(THEME_KEY, theme); } catch {} }
}

/* Boot: explicit ?lang= wins, then stored choice, then browser language, else English. */
(function boot() {
  const q = new URLSearchParams(location.search).get('lang');
  let stored = null;
  try { stored = localStorage.getItem(KEY); } catch {}
  const nav = (navigator.language || 'en').toLowerCase();
  const initial = q || stored || (nav.startsWith('zh') ? 'zh' : 'en');
  setLang(initial, { persist: false });

  let theme = null;
  try { theme = localStorage.getItem(THEME_KEY); } catch {}
  if (!theme) {
    theme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  }
  applyTheme(theme, false);
})();
</script>
